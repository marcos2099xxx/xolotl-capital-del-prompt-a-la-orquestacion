<!--
  FRAGMENTO DE CÓDIGO SELECCIONADO — PROTOTIPO WEB XOLOTL CAPITAL
  Archivo de origen: index.html (abril de 2026)
  Propósito: Demostrar la arquitectura SPA web con HTML semántico, Tailwind CSS y componentes modulares.
  Nota: Se extraen únicamente los contenedores estructurales y el modal de intervención socrática.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xolotl Capital - Simulador Bursátil Gamificado (Prototipo Web)</title>
    <!-- Tailwind CSS y Chart.js vía CDN para prototipado rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

    <!-- Header con resumen de capital virtual y racha -->
    <header class="sticky top-0 z-40 bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🦅</span>
                <span class="font-bold text-lg text-blue-400">Xolotl Capital</span>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <div id="user-streak" class="flex items-center gap-1 text-orange-400">🔥 <span>3</span> días</div>
                <div id="user-balance" class="font-mono font-bold text-emerald-400">$100,000.00 MXN</div>
            </div>
        </div>
    </header>

    <!-- Contenedor principal de pestañas navegables -->
    <main class="max-w-4xl mx-auto p-4">
        <!-- Pestaña 1: Mercado de Acciones -->
        <section id="tab-market" class="tab-content active space-y-4">
            <h2 class="text-xl font-bold">Mercado Bursátil Mexicano (BMV)</h2>
            <div id="market-list" class="grid gap-3">
                <!-- Se puebla dinámicamente desde market.js / assets.js -->
            </div>
        </section>

        <!-- Pestaña 2: Portafolio de Inversión -->
        <section id="tab-portfolio" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold">Tu Portafolio</h2>
            <div id="portfolio-summary" class="bg-slate-800 p-4 rounded-xl border border-slate-700"></div>
            <div id="portfolio-holdings" class="space-y-2"></div>
        </section>

        <!-- Pestaña 3: Misiones y Gamificación -->
        <section id="tab-missions" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold">Misiones Educativas</h2>
            <div id="missions-list" class="space-y-3"></div>
        </section>
    </main>

    <!-- Modal de Intervención Socrática (Mitigación de sesgos antes de ejecutar orden) -->
    <div id="socratic-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-amber-500/40 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🤖</span>
                <div>
                    <h3 class="font-bold text-amber-400 text-lg">Xolo Tutor — Pausa Reflexiva</h3>
                    <p class="text-xs text-slate-400">Antes de comprometer tu capital virtual...</p>
                </div>
            </div>
            
            <p id="socratic-question" class="text-sm text-slate-200 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
                <!-- Pregunta generada por ai-socratic.js según el sesgo detectado -->
            </p>

            <div class="space-y-2">
                <label for="socratic-response" class="text-xs text-slate-300 font-medium">Justifica tu decisión con tus propias palabras:</label>
                <textarea id="socratic-response" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Escribe tu argumento (ej. tendencia, soporte, riesgo, diversificación)..."></textarea>
            </div>

            <div class="flex gap-3 justify-end pt-2">
                <button id="socratic-cancel-btn" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-slate-200">Reconsiderar</button>
                <button id="socratic-confirm-btn" class="px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium">Confirmar Orden</button>
            </div>
        </div>
    </div>

    <!-- Carga modular de módulos JavaScript desacoplados -->
    <script src="data/assets.js"></script>
    <script src="js/ai-socratic.js"></script>
    <script src="js/portfolio.js"></script>
    <script src="js/market.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
